<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#85a5d6">
<title>子叶是顶细胞发育的</title>
<style>
:root{
  --bg:#f6f8fc;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#dce5f2;
  --brand:#85a5d6;--brand-dark:#607fae;--brand-soft:#edf3fa;--green:#16a34a;
  --red:#dc2626;--amber:#b45309;--shadow:0 10px 28px rgba(66,94,135,.10)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:30;background:rgba(246,248,252,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-inner{width:min(1080px,100%);margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:20px}
.brand-dot{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--brand),#b9cbe5);display:grid;place-items:center;color:#fff}
.container{width:min(1080px,100%);margin:auto;padding:18px 16px 96px}
.hero{background:linear-gradient(135deg,#eaf1fa,#f4f7fb 60%,#fff);border:1px solid #d5e1f0;border-radius:24px;padding:22px;margin-bottom:18px;box-shadow:var(--shadow)}
.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:0;color:var(--muted);line-height:1.7}
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;white-space:nowrap;font-size:13px;font-weight:700}
.chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.product{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.product-img{aspect-ratio:1/1;width:100%;object-fit:cover;display:block;background:var(--brand-soft)}
.placeholder{aspect-ratio:1/1;display:grid;place-items:center;background:linear-gradient(135deg,#eaf1fa,#dbe7f5);font-size:46px}
.product-body{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.author{display:inline-flex;align-self:flex-start;background:#f3f4f6;color:#4b5563;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:750}
.bundle-tag{background:#eef2ff;color:#4f46e5}
.product-title{font-weight:850;line-height:1.35}.product-desc{font-size:12px;color:var(--muted);line-height:1.45;min-height:34px}
.bundle-components{font-size:11px;color:#64748b;line-height:1.55;background:#f8fafc;border-radius:10px;padding:8px}
.product-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:8px}
.price{font-size:19px;font-weight:900;color:var(--brand-dark)}
.add-btn{width:36px;height:36px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-size:22px;font-weight:700}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;padding:9px 13px;font-weight:700}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.small{padding:7px 10px;font-size:13px}
.btn.danger{color:var(--red)}.btn.warn{color:var(--amber)}
.cart-fab{position:fixed;right:18px;bottom:20px;z-index:40;border:0;background:var(--text);color:#fff;border-radius:18px;padding:13px 17px;display:flex;align-items:center;gap:9px;font-weight:800;box-shadow:0 14px 34px rgba(0,0,0,.2)}
.badge{min-width:22px;height:22px;border-radius:999px;background:var(--brand);display:grid;place-items:center;font-size:12px;padding:0 6px}
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.42);z-index:50;display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}
.sheet{background:#fff;width:min(680px,100%);max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px 24px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.sheet-head h2,.sheet-head h3{margin:0}
.close{border:0;background:#f3f4f6;width:34px;height:34px;border-radius:10px;font-size:18px}
.cart-item{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #eee}.cart-thumb{width:58px;height:58px;border-radius:12px;object-fit:cover;background:var(--brand-soft)}
.cart-main{flex:1;min-width:0}.cart-title{font-weight:800}.cart-meta{font-size:12px;color:var(--muted);margin-top:3px}.cart-side{text-align:right}
.qty{display:flex;align-items:center;gap:8px;margin-top:7px}.qty button{border:1px solid var(--line);background:#fff;border-radius:8px;width:28px;height:28px}
.total-line{display:flex;justify-content:space-between;align-items:center;padding:15px 0 10px;font-size:16px}.total-line strong{font-size:24px;color:var(--brand-dark)}
.checkout-btn{width:100%;border:0;background:var(--brand);color:#fff;border-radius:14px;padding:13px;font-weight:850;font-size:16px}
.qr-box{text-align:center;padding:8px 0 4px}.qr-box img{width:min(280px,75vw);border-radius:18px;border:1px solid var(--line);background:#fff}
.qr-placeholder{width:min(280px,75vw);aspect-ratio:1;margin:auto;border:2px dashed var(--line);border-radius:18px;display:grid;place-items:center;color:var(--muted);padding:24px}
.order-summary{background:#f9fafb;border-radius:14px;padding:12px;margin:12px 0;font-size:13px;line-height:1.7}
.success{background:#ecfdf5;color:#166534;border-radius:14px;padding:12px;margin:12px 0;display:none}
.notice{font-size:12px;color:var(--muted);line-height:1.6;background:#f9fafb;padding:10px;border-radius:11px;margin-top:10px}
.errorbox{background:#fef2f2;color:#991b1b;border-radius:12px;padding:11px 12px;margin:10px 0;display:none;font-size:13px}
.loading,.empty{padding:42px 10px;text-align:center;color:var(--muted)}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px 2px;font-weight:700}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:#fff;outline:none}
.field textarea{min-height:76px;resize:vertical}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{background:#f9fafb;border-radius:13px;padding:12px}.stat span{font-size:11px;color:var(--muted)}.stat b{display:block;font-size:20px;margin-top:4px}
.stat.net{background:#eef6ff}.stat.refund{background:#fff7ed}.stat.cancel{background:#f8fafc}
.admin-shell{width:min(1180px,100%);margin:auto;padding:18px 16px 60px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.admin-grid{display:grid;grid-template-columns:360px 1fr;gap:16px}.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-weight:700}.tab.active{background:var(--brand);border-color:var(--brand);color:#fff}
.preview{width:100%;aspect-ratio:16/10;border:1px dashed var(--line);border-radius:14px;object-fit:cover;background:var(--brand-soft);display:none;margin-top:8px}
.admin-list{display:flex;flex-direction:column;gap:10px}.admin-product{display:grid;grid-template-columns:68px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px}
.admin-product img,.mini-ph{width:68px;height:68px;border-radius:11px;object-fit:cover;background:var(--brand-soft)}.mini-ph{display:grid;place-items:center;font-size:28px}
.admin-product .name{font-weight:800}.admin-product .meta{font-size:12px;color:var(--muted);margin-top:4px}.admin-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bundle-option{display:grid;grid-template-columns:1fr 78px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}.bundle-option:last-child{border-bottom:0}
.bundle-option input[type=number]{width:78px}
.order-row{border:1px solid #edf0f4;border-radius:14px;padding:12px;margin-bottom:10px}.order-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.order-id{font-weight:800}.order-time{color:var(--muted);font-size:12px}.order-items{font-size:12px;color:#4b5563;margin-top:6px;line-height:1.7}
.order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.status{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.status.ok{background:#ecfdf5;color:#166534}.status.cancelled{background:#f1f5f9;color:#475569}.status.refunded{background:#fff7ed;color:#9a3412}
.author-stat{display:grid;grid-template-columns:1fr 90px 90px 90px;gap:8px;padding:8px 0;border-bottom:1px solid #eee;font-size:13px;align-items:center}.author-stat.head{font-size:11px;color:var(--muted);font-weight:700}.author-stat:last-child{border-bottom:0}
.hidden{display:none!important}
.login-card{width:min(440px,calc(100% - 28px));margin:11vh auto 0;background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.login-card h1{margin:0 0 7px;font-size:24px}.login-card p{color:var(--muted);font-size:13px;line-height:1.65}

.tag-list{display:flex;gap:5px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;background:#eef3f8;color:#52606d;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:700}
.limit-note{font-size:11px;color:#b45309;font-weight:700}
.filter-group{margin-bottom:8px}
.filter-label{font-size:11px;color:var(--muted);font-weight:800;margin:0 0 6px 2px}


.stock-note{font-size:11px;font-weight:750;color:#64748b}
.stock-note.low{color:#b45309}.stock-note.out{color:#dc2626}
.add-btn:disabled{background:#cbd5e1;cursor:not-allowed}
.live-pill{display:inline-flex;align-items:center;gap:6px;background:#f1f5f9;color:#64748b;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800}
.live-pill.on{background:#ecfdf5;color:#166534}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-20px);z-index:100;background:#1f2937;color:#fff;border-radius:12px;padding:11px 15px;font-size:13px;font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}


.tag-order-list{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.tag-order-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 9px;background:#fff}
.tag-order-actions{display:flex;gap:5px}
.tag-order-actions button{width:32px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:800}


.search-wrap{position:relative;margin:0 0 14px}
.search-input{
  width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;
  padding:12px 42px 12px 42px;outline:none;box-shadow:var(--shadow);
  color:var(--text)
}
.search-input:focus{border-color:var(--brand)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:17px;opacity:.65;pointer-events:none}
.search-clear{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:30px;height:30px;border:0;background:#f1f5f9;border-radius:9px;
  color:#64748b;font-size:17px;display:none
}
.search-clear.show{display:block}
.search-meta{font-size:11px;color:var(--muted);margin:-5px 0 10px 2px}

@media(max-width:900px){.product-grid{grid-template-columns:repeat(2,1fr)}.admin-grid{grid-template-columns:1fr}.author-stat{grid-template-columns:1fr 75px 75px 75px}}
@media(max-width:430px){.container{padding-left:12px;padding-right:12px}.hero{padding:18px}.hero h1{font-size:24px}.product-grid{gap:10px}.product-body{padding:10px}.product-desc{min-height:0}.admin-product{grid-template-columns:56px 1fr}.admin-product img,.mini-ph{width:56px;height:56px}.admin-actions{grid-column:1/-1;justify-content:flex-start}.stats{grid-template-columns:1fr}.author-stat{grid-template-columns:1fr 64px 64px 64px;font-size:11px}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><div class="brand"><div class="brand-dot">店</div><span id="shopNameTop">摊位小店</span></div></div></header>

<main class="container">
  <section class="hero"><h1 id="shopNameHero">摊位小店</h1><p id="shopSlogan">正在加载店铺信息…</p></section>
  <div id="loadError" class="errorbox"></div>

  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input id="productSearch" class="search-input" type="search"
           placeholder="搜索商品、作者、标签…"
           autocomplete="off"
           oninput="setSearch(this.value)">
    <button id="searchClear" class="search-clear" type="button" onclick="clearSearch()" aria-label="清除搜索">×</button>
  </div>
  <div id="searchMeta" class="search-meta"></div>

  <div class="filter-group"><div class="filter-label">作者</div><div id="authorFilters" class="filters"></div></div>
  <div class="filter-group"><div class="filter-label">标签</div><div id="tagFilters" class="filters"></div></div>
  <section id="productGrid" class="product-grid"><div class="loading" style="grid-column:1/-1">正在从云端加载商品…</div></section>
</main>

<button class="cart-fab" onclick="openCart()">🛒 购物车 <span class="badge" id="cartCount">0</span></button>

<div id="cartOverlay" class="overlay" onclick="overlayClose(event,'cartOverlay')">
  <div class="sheet"><div class="sheet-head"><h2>购物车</h2><button class="close" onclick="closeOverlay('cartOverlay')">×</button></div>
  <div id="cartItems"></div><div class="total-line"><span>合计</span><strong id="cartTotal">¥0.00</strong></div>
  <button class="checkout-btn" onclick="openCheckout()">去买单</button></div>
</div>

<div id="checkoutOverlay" class="overlay" onclick="overlayClose(event,'checkoutOverlay')">
  <div class="sheet"><div class="sheet-head"><h2>扫码买单</h2><button class="close" onclick="closeOverlay('checkoutOverlay')">×</button></div>
  <div class="order-summary" id="checkoutSummary"></div><div class="qr-box" id="qrBox"></div>
  <p style="text-align:center;color:var(--muted);font-size:13px" id="paymentCaption">请扫码付款</p>
  <div class="errorbox" id="checkoutError"></div><div class="success" id="paySuccess"></div>
  <button class="checkout-btn" id="paidBtn" onclick="confirmPaid()">我已完成付款</button>
  <div class="notice">点击“我已完成付款”只会生成“待确认”订单。摊主核实收款后在后台确认，订单才会计入销售额。</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://okgnpgamahaucmvyquzx.supabase.co";
const SUPABASE_KEY="sb_publishable_guo63tjKVNsIplXZ5bdGuQ_Z6FdzACy";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let products=[],bundleComponents=[],settings={name:'摊位小店',slogan:'欢迎选购喜欢的作品。',payment_caption:'请使用微信/支付宝扫码付款',qr_url:'',tag_order:[]};
let cart=JSON.parse(localStorage.getItem('stall_cloud_cart')||'{}'),activeAuthor='全部',activeTag='全部',searchQuery='',pendingOrder=null;
function money(n){return '¥'+Number(n||0).toFixed(2)}
function orderNo(n){return String(n??'')}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function escJs(s){return String(s).replaceAll('\\','\\\\').replaceAll("'","\\'")}
function authorEmoji(name){const a=['🎨','🧵','🌿','✨','🧸','🍀','🌙','🪄'];let s=0;for(const c of String(name))s+=c.charCodeAt(0);return a[s%a.length]}
function saveCart(){localStorage.setItem('stall_cloud_cart',JSON.stringify(cart));updateCartCount()}
function showError(msg){const e=document.getElementById('loadError');e.textContent=msg;e.style.display=msg?'block':'none'}
function bundleText(p){
  if(p.product_type!=='bundle')return '';
  const comps=bundleComponents.filter(x=>x.bundle_product_id===p.id).map(x=>{const cp=products.find(z=>z.id===x.component_product_id);return cp?`${cp.name} ×${x.quantity}`:''}).filter(Boolean);
  return comps.join(' · ');
}
async function loadCloudData(){
  showError('');
  const [pRes,cRes,sRes]=await Promise.all([
    sb.from('products').select('id,name,author,tags,max_per_order,stock_qty,sort_order,price,description,image_url,product_type,is_active,created_at').eq('is_active',true).order('created_at',{ascending:false}),
    sb.from('bundle_components').select('bundle_product_id,component_product_id,quantity'),
    sb.from('shop_settings').select('name,slogan,payment_caption,qr_url,tag_order').eq('id',1).maybeSingle()
  ]);
  if(pRes.error){showError('商品加载失败：'+pRes.error.message);return}
  products=pRes.data||[];bundleComponents=cRes.data||[];if(sRes.data)settings={...settings,...sRes.data};renderShop();
}
function renderShop(){
  shopNameTop.textContent=settings.name||'摊位小店';shopNameHero.textContent=settings.name||'摊位小店';shopSlogan.textContent=settings.slogan||'';
  renderFilters();renderTagFilters();renderProducts();updateCartCount();
}
function renderFilters(){
  const authors=[...new Set(products.filter(p=>p.product_type!=='bundle').map(p=>p.author).filter(Boolean))];
  if(activeAuthor!=='全部'&&activeAuthor!=='组合商品'&&!authors.includes(activeAuthor))activeAuthor='全部';
  const labels=['全部',...authors];if(products.some(p=>p.product_type==='bundle'))labels.push('组合商品');
  authorFilters.innerHTML=labels.map(a=>`<button class="chip ${a===activeAuthor?'active':''}" onclick="setAuthor('${escJs(a)}')">${esc(a)}</button>`).join('');
}
function renderTagFilters(){
  const allTags=[...new Set(products.flatMap(p=>Array.isArray(p.tags)?p.tags:[]).map(x=>String(x).trim()).filter(Boolean))];
  const saved=Array.isArray(settings.tag_order)?settings.tag_order:[];
  const ordered=[
    ...saved.filter(t=>allTags.includes(t)),
    ...allTags.filter(t=>!saved.includes(t)).sort((a,b)=>a.localeCompare(b,'zh-CN'))
  ];
  if(activeTag!=='全部'&&!ordered.includes(activeTag))activeTag='全部';
  tagFilters.innerHTML=['全部',...ordered].map(t=>`<button class="chip ${t===activeTag?'active':''}" onclick="setTag('${escJs(t)}')">${esc(t)}</button>`).join('');
}
function setAuthor(a){activeAuthor=a;renderFilters();renderProducts()}
function setTag(t){activeTag=t;renderTagFilters();renderProducts()}
function availableStock(p){
  if(!p)return 0;
  if(p.product_type!=='bundle')return p.stock_qty==null?null:Number(p.stock_qty);
  const comps=bundleComponents.filter(x=>x.bundle_product_id===p.id);
  if(!comps.length)return 0;
  let limits=[];
  for(const c of comps){
    const cp=products.find(x=>x.id===c.component_product_id);
    if(!cp)return 0;
    if(cp.stock_qty!=null)limits.push(Math.floor(Number(cp.stock_qty)/Number(c.quantity||1)));
  }
  return limits.length?Math.max(0,Math.min(...limits)):null;
}
function stockText(p){
  const s=availableStock(p);
  if(s==null)return '';
  if(s<=0)return '<div class="stock-note out">已售罄</div>';
  if(s<=3)return `<div class="stock-note low">仅剩 ${s} 件</div>`;
  return `<div class="stock-note">库存 ${s}</div>`;
}
function effectiveCartLimit(p){
  const vals=[];
  const stock=availableStock(p),per=Number(p.max_per_order||0);
  if(stock!=null)vals.push(stock);
  if(per>0)vals.push(per);
  return vals.length?Math.min(...vals):null;
}
function normalizeSearchText(v){
  return String(v??'').trim().toLocaleLowerCase('zh-CN');
}
function productMatchesSearch(p,q){
  if(!q)return true;
  const haystack=[
    p.name,
    p.author,
    p.description,
    ...(Array.isArray(p.tags)?p.tags:[]),
    p.product_type==='bundle'?'组合商品 套装':'单品'
  ].map(normalizeSearchText).join(' ');
  return haystack.includes(q);
}
function setSearch(v){
  searchQuery=normalizeSearchText(v);
  if(window.searchClear)searchClear.classList.toggle('show',!!searchQuery);
  renderProducts();
}
function clearSearch(){
  searchQuery='';
  if(window.productSearch)productSearch.value='';
  if(window.searchClear)searchClear.classList.remove('show');
  renderProducts();
  if(window.productSearch)productSearch.focus();
}
function renderProducts(){
  let list=[...products].sort((a,b)=>Number(a.sort_order||0)-Number(b.sort_order||0)||new Date(a.created_at)-new Date(b.created_at));
  if(activeAuthor==='组合商品')list=list.filter(p=>p.product_type==='bundle');
  else if(activeAuthor!=='全部')list=list.filter(p=>p.product_type!=='bundle'&&p.author===activeAuthor);
  if(activeTag!=='全部')list=list.filter(p=>(p.tags||[]).includes(activeTag));
  if(searchQuery)list=list.filter(p=>productMatchesSearch(p,searchQuery));

  if(window.searchMeta){
    if(searchQuery){
      searchMeta.textContent=`找到 ${list.length} 件与“${productSearch.value.trim()}”相关的商品`;
    }else{
      searchMeta.textContent='';
    }
  }

  if(!list.length){
    productGrid.innerHTML=`<div class="empty" style="grid-column:1/-1">${searchQuery?'没有找到匹配商品':'暂时没有商品'}</div>`;
    return;
  }
  productGrid.innerHTML=list.map(p=>`
    <article class="product">
      ${p.image_url?`<img class="product-img" src="${esc(p.image_url)}" alt="${esc(p.name)}">`:`<div class="placeholder">${p.product_type==='bundle'?'🎁':authorEmoji(p.author)}</div>`}
      <div class="product-body">
        <span class="author ${p.product_type==='bundle'?'bundle-tag':''}">${p.product_type==='bundle'?'组合套装':esc(p.author||'未标作者')}</span>
        <div class="product-title">${esc(p.name)}</div>
        ${(p.tags||[]).length?`<div class="tag-list">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
        <div class="product-desc">${esc(p.description||'')}</div>
        ${p.product_type==='bundle'?`<div class="bundle-components">${esc(bundleText(p)||'组合内容')}</div>`:''}
        ${Number(p.max_per_order||0)>0?`<div class="limit-note">每单限购 ${p.max_per_order} 件</div>`:''}
        ${stockText(p)}
        <div class="product-foot"><div class="price">${money(p.price)}</div><button class="add-btn" ${availableStock(p)===0?'disabled':''} onclick="addToCart('${p.id}')">${availableStock(p)===0?'×':'+'}</button></div>
      </div>
    </article>`).join('');
}
function addToCart(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  const limit=effectiveCartLimit(p),next=(cart[id]||0)+1;
  if(limit!=null&&next>limit){
    const stock=availableStock(p),per=Number(p.max_per_order||0);
    if(stock===0)alert(`“${p.name}”已售罄`);
    else if(stock!=null&&stock<=per||stock!=null&&per<=0)alert(`“${p.name}”当前库存仅剩 ${stock} 件`);
    else alert(`“${p.name}”每单限购 ${per} 件`);
    return;
  }
  cart[id]=next;saveCart();
}
function updateCartCount(){cartCount.textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function openCart(){renderCart();cartOverlay.classList.add('show')}
function renderCart(){
  const lines=Object.entries(cart).map(([id,qty])=>({p:products.find(x=>x.id===id),qty})).filter(x=>x.p);
  cartItems.innerHTML=lines.length?lines.map(({p,qty})=>`<div class="cart-item">
    ${p.image_url?`<img class="cart-thumb" src="${esc(p.image_url)}">`:`<div class="cart-thumb" style="display:grid;place-items:center;font-size:26px">${p.product_type==='bundle'?'🎁':authorEmoji(p.author)}</div>`}
    <div class="cart-main"><div class="cart-title">${esc(p.name)}</div><div class="cart-meta">${p.product_type==='bundle'?'组合套装':esc(p.author)} · ${money(p.price)}</div>
    <div class="qty"><button onclick="changeQty('${p.id}',-1)">−</button><b>${qty}</b><button onclick="changeQty('${p.id}',1)">+</button></div></div>
    <div class="cart-side"><b>${money(p.price*qty)}</b></div></div>`).join(''):'<div class="empty">购物车还是空的</div>';
  cartTotal.textContent=money(getCartTotal());
}
function changeQty(id,d){
  const p=products.find(x=>x.id===id);if(!p)return;
  const next=(cart[id]||0)+d,limit=effectiveCartLimit(p);
  if(d>0&&limit!=null&&next>limit){
    const stock=availableStock(p),per=Number(p.max_per_order||0);
    if(stock!=null&&(per<=0||stock<=per))alert(`“${p.name}”当前库存仅剩 ${stock} 件`);
    else alert(`“${p.name}”每单限购 ${per} 件`);
    return;
  }
  cart[id]=next;if(cart[id]<=0)delete cart[id];saveCart();renderCart();
}
function getCartTotal(){return Object.entries(cart).reduce((s,[id,q])=>{const p=products.find(x=>x.id===id);return s+(p?Number(p.price)*q:0)},0)}
function openCheckout(){
  if(getCartTotal()<=0){alert('购物车还是空的');return}
  pendingOrder=Object.entries(cart).map(([product_id,qty])=>({product_id,qty})).filter(x=>products.some(p=>p.id===x.product_id));
  checkoutSummary.innerHTML=pendingOrder.map(x=>{const p=products.find(z=>z.id===x.product_id);return `${esc(p.name)} × ${x.qty} <span style="float:right">${money(p.price*x.qty)}</span>`}).join('<br>')+
    `<hr style="border:0;border-top:1px solid #e5e7eb;margin:8px 0"><b>合计</b><b style="float:right;color:var(--brand-dark)">${money(getCartTotal())}</b>`;
  qrBox.innerHTML=settings.qr_url?`<img src="${esc(settings.qr_url)}" alt="收款二维码">`:`<div class="qr-placeholder">摊主还没有上传收款二维码</div>`;
  paymentCaption.textContent=settings.payment_caption||'请扫码付款';checkoutError.style.display='none';paySuccess.style.display='none';paidBtn.disabled=false;paidBtn.textContent='我已完成付款';
  closeOverlay('cartOverlay');checkoutOverlay.classList.add('show');
}
async function confirmPaid(){
  if(!pendingOrder?.length)return;
  paidBtn.disabled=true;paidBtn.textContent='正在记录订单…';checkoutError.style.display='none';

  const {data:orderId,error}=await sb.rpc('create_shop_order',{items_json:pendingOrder});

  if(error){
    checkoutError.textContent='订单记录失败：'+error.message;
    checkoutError.style.display='block';
    paidBtn.disabled=false;
    paidBtn.textContent='重新提交';
    return;
  }

  const {data:orderNumber,error:numberError}=await sb.rpc('get_shop_order_number',{p_order_id:orderId});

  if(numberError || orderNumber==null){
    checkoutError.textContent='订单已创建，但订单号获取失败。请向摊主说明下单时间。';
    checkoutError.style.display='block';
    paidBtn.disabled=false;
    paidBtn.textContent='订单已创建';
    return;
  }

  const no=orderNo(orderNumber);
  cart={};saveCart();pendingOrder=null;

  paySuccess.innerHTML=`<b>订单已提交，等待摊主确认。</b><br>
    <span style="font-size:13px">订单号：</span>
    <span style="font-size:26px;font-weight:900;letter-spacing:1px">${esc(no)}</span><br>
    <span style="font-size:12px">请记住或截图保存这个订单号，方便与摊主核对。</span>`;
  paySuccess.style.display='block';

  paidBtn.textContent='订单已提交';
  alert(`订单提交成功！\n订单号：${no}\n\n请记住或截图保存订单号。`);
}
function closeOverlay(id){document.getElementById(id).classList.remove('show')}function overlayClose(e,id){if(e.target.id===id)closeOverlay(id)}
loadCloudData();
sb.channel('shop-public-sync-v5').on('postgres_changes',{event:'*',schema:'public',table:'products'},()=>loadCloudData()).on('postgres_changes',{event:'*',schema:'public',table:'bundle_components'},()=>loadCloudData()).on('postgres_changes',{event:'*',schema:'public',table:'shop_settings'},()=>loadCloudData()).subscribe();
</script>
</body></html>
